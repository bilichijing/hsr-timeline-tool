[project]
name = "hsr-timeline-tool"
version = "0.1.0"
description = "崩坏：星穹铁道排轴与伤害计算工具"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "pydantic>=2.5",
    "diskcache>=5.6",
    "Pillow>=10.0",
    "loguru>=0.7",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
